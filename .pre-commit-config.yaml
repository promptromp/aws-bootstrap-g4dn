fail_fast: true
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: [ --maxkb=8192 ]
    - id: fix-byte-order-marker
    - id: check-case-conflict
    - id: check-json
      exclude: ^aws_bootstrap/resources/(launch|tasks)\.json$
    - id: check-yaml
      args: [ --unsafe ]
    - id: detect-aws-credentials
      args: [ --allow-missing-credentials ]
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.4
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.1
  hooks:
    - id: mypy
      additional_dependencies: [types-pyyaml>=6.0.12, types-tabulate>=0.9]
      # examples/ are illustrative scripts that import torch (not a project
      # dependency); they are ruff-linted but not type-checked.
      exclude: ^examples/
- repo: local
  hooks:
  # Only the tests the change can reach (pytest-impacted; rules in pyproject's
  # [tool.pytest.ini_options]), selected from git's state rather than pre-commit's file
  # list: a commit sees what is staged plus new files (pre-commit stashes unstaged edits
  # first), and `pre-commit run --all` also sees unstaged edits. A change that reaches
  # no test passes, so a clean tree runs none. A push to main runs the whole suite in CI;
  # run it locally with `uv run pytest`.
  - id: pytest
    name: pytest [impacted, without slow]
    entry: uv run python -m pytest -q -m "not slow" --impacted --impacted-git-mode=unstaged
    language: system
    pass_filenames: false
    always_run: true
