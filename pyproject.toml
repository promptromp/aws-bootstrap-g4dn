[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-bootstrap-g4dn"
description = "Bootstrap AWS EC2 GPU instances for hybrid local-remote development"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Adam Ever-Hadani" }]
keywords = ["aws", "ec2", "gpu", "cuda", "deep-learning", "spot-instances", "cli"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3>=1.43",
    "click>=8.4",
    "pyyaml>=6.0.3",
    "tabulate>=0.10",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/promptromp/aws-bootstrap-g4dn"
Issues = "https://github.com/promptromp/aws-bootstrap-g4dn/issues"

[project.scripts]
aws-bootstrap = "aws_bootstrap.cli:main"

[tool.setuptools.packages.find]
include = ["aws_bootstrap*"]

[tool.setuptools.package-data]
"aws_bootstrap.resources" = ["*.sh", "*.txt", "*.ipynb", "*.json", "*.cu"]

[tool.setuptools_scm]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["aws_bootstrap/tests"]
markers = ["slow: long-running test, skipped by the pre-commit hook (-m 'not slow')"]
# pytest-impacted: the pre-commit hook and pull-request CI run only the tests a change can
# reach (`pytest --impacted`); a push to main runs them all. The plugin follows imports from
# aws_bootstrap/ and the test files. Anything else a test depends on needs a rule below, and
# a rule that is wrong must select more, never less. tests/test_impacted_rules.py checks that
# every non-Python file in the package matches a rule. `*` matches one path segment and `**`
# any depth (pytest_impacted.strategies.matches_any_glob).
impacted_module = "aws_bootstrap"
impacted_tests_dir = "aws_bootstrap/tests"
# Dependencies, the toolchain and CI config can affect any test: a change to one runs them all.
impacted_invalidate_all = [
    "pyproject.toml",
    "uv.lock",
    ".pre-commit-config.yaml",
    ".github/workflows/**",
]
# Files that tests *read* (rather than import) count as a change to the test that reads them.
impacted_map = [
    # Any package change runs the rules' own check (4 fast tests): a new kind of file must
    # get a rule before a change to it is silently missed. It imports no package code, so
    # without this line the plugin would never select it for the change it exists to catch.
    "aws_bootstrap/**=aws_bootstrap/tests/test_impacted_rules.py",
    "aws_bootstrap/resources/cluster_canary.py=aws_bootstrap/tests/test_cluster.py",
    # remote_setup.sh and every SETUP_PAYLOAD file are checked by the payload-wiring tests.
    # `**`, not `*`: a `*` glob matches one path segment, so it would miss resources/<dir>/<file>.
    "aws_bootstrap/resources/**=aws_bootstrap/tests/test_torch_index.py",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Pylint (Convention)
    "PLC",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["aws_bootstrap"]
lines-after-imports = 2
no-lines-before = ["standard-library"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
# Dev-tool floors track the versions CI and pre-commit actually run: ruff's lint
# rules and formatting change between minors, so a lower floor would let a
# contributor format the tree differently than `ruff format --check` in CI.
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-impacted[fast]>=0.38.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
    "types-tabulate>=0.10.0.20261006",
]
